name: Speaker Recognition
version: "2.0.1"
slug: speaker_recognition
description: >-
  Identify who is speaking to Home Assistant from their voice, using ONNX
  speaker embeddings.
url: https://github.com/PeterLinuxOSS/speaker-recognition
arch:
  - amd64
init: false
startup: services
boot: auto
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Speaker Recognition API, used by the integration
watchdog: http://[HOST]:[PORT:8099]/health
map:
  - share:rw
options:
  host: "0.0.0.0"
  port: 8099
  log_level: "info"
  access_log: true
  embeddings_dir: "/share/speaker_recognition/embeddings"
  num_threads: 2
schema:
  host: str
  port: port
  log_level: list(debug|info|warning|error|critical)
  access_log: bool
  embeddings_dir: str
  num_threads: int(1,8)
