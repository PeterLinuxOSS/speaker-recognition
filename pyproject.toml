[project]
name = "hass-speaker-recognition"
version = "2.0.0"
description = "Speaker recognition for Home Assistant using ONNX speaker embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["speaker_recognition*"]

[project.optional-dependencies]
server = [
    "fastapi>=0.68.1",
    "numpy>=1.26",
    "python-dotenv>=0.20.0",
    "sherpa-onnx>=1.10.0",
    "typer>=0.10.0",
    "uvicorn>=0.16.0",
]

[dependency-groups]
dev = [
    "mypy>=0.971",
    "ruff>=0.0.17",
    "hass-speaker-recognition[server]",
]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hass-speaker-recognition[server]",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
filterwarnings = [
  "ignore::DeprecationWarning:pkg_resources:",
]
